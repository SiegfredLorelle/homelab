services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./sites:/srv

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "100.115.71.107:53:53/tcp"
      - "100.115.71.107:53:53/udp"
      - "127.0.0.1:8082:80/tcp"
    environment:
      TZ: Asia/Manila
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: 9.9.9.9;149.112.112.112
      FTLCONF_dns_hosts: "100.83.224.118 arch-pc;100.118.199.45 macbook-pro-m5;100.100.1.81 nothing-phone-3a"
    volumes:
      - ./pihole/data:/etc/pihole
