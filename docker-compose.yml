services:
  caddy:
    build: ./caddy
    image: homelab-caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
      - "100.115.71.107:443:443"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env (see .env.example)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./sites:/srv
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/pages:/etc/caddy/pages:ro
    networks:
      default:
        aliases:
          - lab.sieg.dev
          - status.lab.sieg.dev
          - dns.lab.sieg.dev

  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data

  pihole:
    image: pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    container_name: pihole
    restart: unless-stopped
    ports:
      - "100.115.71.107:53:53/tcp"
      - "100.115.71.107:53:53/udp"
      - "127.0.0.1:8082:80/tcp"
    environment:
      TZ: Asia/Manila
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env (see .env.example)}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: 9.9.9.9;149.112.112.112
      FTLCONF_dns_hosts: "100.83.224.118 arch-pc;100.118.199.45 macbook-m5-pro;100.100.1.81 nothing-phone-3a"
      FTLCONF_misc_dnsmasq_lines: "address=/lab.sieg.dev/100.115.71.107"
    volumes:
      - ./pihole/data:/etc/pihole

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: lab.sieg.dev
      PUID: 1000
      PGID: 1000
      HOMEPAGE_VAR_PIHOLE_KEY: ${HOMEPAGE_VAR_PIHOLE_KEY:?Set HOMEPAGE_VAR_PIHOLE_KEY in .env (see .env.example)}
    volumes:
      - ./homepage/config:/app/config
