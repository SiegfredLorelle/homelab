# Forward every lookup to Quad9 over DNS-over-TLS (port 853), so the ISP can't read them.
# The "#dns.quad9.net" part makes Unbound check Quad9's certificate.
server:
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
