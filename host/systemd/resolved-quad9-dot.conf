# Encrypt the NUC's own DNS: every lookup goes to Quad9 over DNS-over-TLS (port 853).
# The #dns.quad9.net part makes resolved check Quad9's certificate.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
DNSOverTLS=yes
Domains=~.
# Never fall back to built-in plain-DNS servers
FallbackDNS=
