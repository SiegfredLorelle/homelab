# Monitor the OS SSD; problems are sent to healthchecks.io via smartd-alert.sh
#   -a         watch health, attributes, error and self-test logs
#   -s ...     short self-test daily at 02:00, long self-test Sundays at 03:00
#   -W 4,50,60 log temperature changes of 4°C; info at 50°C; alert at 60°C
/dev/sda -a -s (S/../.././02|L/../../7/03) -W 4,50,60 -m <nomailer> -M exec /usr/local/bin/smartd-alert.sh
